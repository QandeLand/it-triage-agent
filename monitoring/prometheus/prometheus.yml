global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: it-triage-agent

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: payment-service
    metrics_path: /metrics
    static_configs:
      - targets: ["app:5000"]
        labels:
          service: payment-service
          environment: production
